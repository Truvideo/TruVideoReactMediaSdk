rootProject.name = 'truvideoreactmediasdk.example'
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesSettingsGradle(settings)
include ':app'

// Configure the React Native Gradle plugin build to use Kotlin 1.9.24
includeBuild('../../node_modules/@react-native/gradle-plugin') {
    dependencySubstitution {
        // Force the included build to use Kotlin 1.9.24
        substitute module('org.jetbrains.kotlin:kotlin-gradle-plugin') using module("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
    }
}
