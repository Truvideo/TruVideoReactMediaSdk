buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["TruVideoReactMediaSdk_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TruVideoReactMediaSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TruVideoReactMediaSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.truvideoreactmediasdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

// Force all Kotlin stdlib dependencies to use our version
// Also force Kodein DI to use a version compatible with Kotlin 2.2.0
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        force "org.kodein.di:kodein-di:7.30.0"
    }
}

dependencies {
  // React Native
  implementation "com.facebook.react:react-native:+"

  // Kotlin
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.4.1"

  // Truvideo SDK
  // implementation('com.github.Truvideo:truvideo-sdk-android-media:79.1.3') {
  implementation("com.truvideo.com:sdk-media:1.0.0") {
    // Exclude kotlin-stdlib from Truvideo SDK to use our version
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    // Exclude Kodein DI from Truvideo SDK to use our compatible version
    exclude group: 'org.kodein.di', module: 'kodein-di'
  }
  implementation 'com.google.code.gson:gson:2.10.1'

  // Kodein DI - Version 7.30.0 is required for Kotlin 2.2.0 compatibility
  implementation "org.kodein.di:kodein-di:7.30.0"

  // Kotlin Multiplatform Settings
  implementation "com.russhwolf:multiplatform-settings:1.0.0"          // common
//  implementation("com.russhwolf:multiplatform-settings-android:1.0.0") {
//    // Exclude debug variant to avoid duplicates
//    exclude group: "com.russhwolf", module: "multiplatform-settings-android-debug"
//  }

}


